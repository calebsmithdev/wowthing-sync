## Run `cargo outdated` to find a list of packages that should be updated.

[package]
name = "wowthing-sync"
version = "0.0.0"
description = "A Tauri App"
authors = ["CalebSmithDev"]
license = "MIT"
repository = "https://github.com/calebsmithdev/wowthing-sync"
edition = "2021"
rust-version = "1.90"

[lib]
name = "wowthing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0.151"
tauri-plugin-store = "2.5.0"
tauri-plugin-persisted-scope = "2.4.0"
tauri-plugin-fs = { version = "2.6.0", features = ["watch"] }
tauri-plugin-shell = "2.4.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-os = "2.4.0"
tauri-plugin-notification = "2.5.1"
tauri-plugin-log = "2.10.0"
log = "0.4.34"
tokio = { version = "1.53.2", features = ["macros", "time", "rt"] }

[dependencies.tauri]
version = "2.12.1"
features = [ "tray-icon" ]

[dependencies.serde]
version = "1.0.229"
features = [ "derive" ]

[dependencies.reqwest]
version = "0.13.5"
features = [ "json", "socks" ]


[dev-dependencies]
httpmock = "0.8.3"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.13.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.2"
