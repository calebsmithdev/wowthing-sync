name: Set up pinned desktop tools
description: Shared locked Node/Rust setup and native prerequisites
inputs:
  native:
    description: Install Linux desktop/package build prerequisites
    default: 'true'
  target:
    description: Optional Rust build target
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22.22.3'
        cache: npm
        cache-dependency-path: apps/desktop/package-lock.json
    - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # verified master
      with:
        toolchain: '1.97.1'
        components: rustfmt, clippy
        targets: ${{ inputs.target }}
    - name: Linux native and packaging prerequisites
      if: runner.os == 'Linux' && inputs.native == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf xvfb rpm cpio desktop-file-utils libfuse2t64
    - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: '. -> target'
    - name: Initialize scoped diagnostic metadata
      shell: bash
      run: node scripts/ci-diagnostics.mjs
    - name: Locked frontend install
      shell: bash
      run: node scripts/ci-run.mjs npm-ci 600 npm ci --prefix apps/desktop
