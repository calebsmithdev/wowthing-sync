name: Publish Release
on:
  workflow_dispatch:
    inputs:
      vendor_version:
        type: string
        description: 'Must equal the version already committed in apps/desktop/src-tauri/Cargo.toml'
        required: true

permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.vendor_version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - run: node --test scripts/release-metadata.test.mjs
      - id: metadata
        run: node scripts/release-metadata.mjs verify
        env:
          RELEASE_VERSION: ${{ inputs.vendor_version }}

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            key: darwin-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            key: darwin-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            key: linux-x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            key: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - run: npm ci
        working-directory: apps/desktop
      - name: Check frontend and generate assets
        run: npm run typecheck && npm run test:unit && npm run generate
        working-directory: apps/desktop
      - name: Check native code before producing artifacts
        run: cargo fmt --all -- --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked && cargo check --locked
      - name: Build signed release without publishing
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} -- --locked
          includeUpdaterJson: false
      - name: Validate build metadata and stage signed assets
        run: node scripts/release-metadata.mjs stage
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          BUILT_APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          RELEASE_PLATFORM: ${{ matrix.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.key }}
          path: release-assets/*
          if-no-files-found: error

  draft-release:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete updater metadata before creating a release
        run: node scripts/release-metadata.mjs merge
      - name: Verify any existing tag identifies this exact commit
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          fi
      - name: Create or resume the matching draft after all checks pass
        id: draft
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,tagName,targetCommitish > "$RUNNER_TEMP/existing-release.json"; then
            export EXISTING_RELEASE_FILE="$RUNNER_TEMP/existing-release.json"
            export EXISTING_TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
            node scripts/release-metadata.mjs existing
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "$RELEASE_TAG" --notes "WoWthing Sync $RELEASE_VERSION" "${flags[@]}"
            echo 'upload=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload validated assets to the draft
        if: steps.draft.outputs.upload == 'true'
        shell: bash
        run: |
          find release-assets -name 'metadata-*.json' -delete
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
