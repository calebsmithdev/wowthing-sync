name: Publish Release
on:
  workflow_dispatch:
    inputs:
      vendor_version:
        type: string
        description: 'Must equal the version already committed in apps/desktop/src-tauri/Cargo.toml'
        required: true

permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.vendor_version }}
  cancel-in-progress: false

jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
      - run: node --test scripts/release-metadata.test.mjs
      - id: metadata
        run: node scripts/release-metadata.mjs verify
        env:
          RELEASE_VERSION: ${{ inputs.vendor_version }}

  checks:
    needs: validate
    uses: ./.github/workflows/desktop-checks.yml
    with:
      tier: release

  build:
    needs: [validate, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            key: darwin-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            key: darwin-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            key: linux-x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            key: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CI_REPORT_DIR: ${{ github.workspace }}/test-results/diagnostics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-desktop
        with:
          target: ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-assets-release
          path: apps/desktop/.output/public/
      - name: Configure provisioned platform signing
        run: node scripts/prepare-release-signing.mjs
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Build signed release without publishing
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          WOWTHING_DISTRIBUTION: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --config "${{ github.workspace }}/target/release-signing.json" -- --locked
          includeUpdaterJson: false
      - name: Reject automation in the shipping executable
        run: node scripts/distribution-check.mjs ${{ matrix.target }}
      - name: Verify real updater and configured platform signatures
        run: node scripts/ci-run.mjs release-signatures 900 node scripts/distribution-signatures.mjs ${{ matrix.target }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      - name: Validate build metadata and stage signed assets
        run: node scripts/release-metadata.mjs stage
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          BUILT_APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          RELEASE_PLATFORM: ${{ matrix.key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.key }}
          path: release-assets/*
          if-no-files-found: error

      - name: Collect native diagnostics and crash records
        if: always()
        run: node scripts/ci-diagnostics.mjs --collect-crashes
      - name: Preserve diagnostic reports and browser traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-release-${{ matrix.key }}
          path: |
            test-results/
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          if-no-files-found: error

  draft-release:
    timeout-minutes: 15
    needs: [validate, checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete updater metadata before creating a release
        run: node scripts/release-metadata.mjs merge
      - name: Verify any existing tag identifies this exact commit
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          fi
      - name: Create or resume the matching draft after all checks pass
        id: draft
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,tagName,targetCommitish > "$RUNNER_TEMP/existing-release.json"; then
            export EXISTING_RELEASE_FILE="$RUNNER_TEMP/existing-release.json"
            export EXISTING_TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
            node scripts/release-metadata.mjs existing
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "$RELEASE_TAG" --notes "WoWthing Sync $RELEASE_VERSION" "${flags[@]}"
            echo 'upload=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload validated assets to the draft
        if: steps.draft.outputs.upload == 'true'
        shell: bash
        run: |
          find release-assets -name 'metadata-*.json' -delete
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
