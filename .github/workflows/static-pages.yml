name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  release:
    types:
      - published
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/static-pages.yml'
  pull_request:
    paths:
      - 'marketing/**'
      - '.github/workflows/static-pages.yml'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Prereleases aren't "latest", so the site keeps pointing at the stable release.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./marketing
    env:
      NUXT_APP_BASE_URL: '/${{ github.event.repository.name }}/'
      # Read release assets with the workflow token to avoid anonymous API rate limits.
      GITHUB_TOKEN: ${{ github.token }}
      WOWTHING_RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx nuxt build --preset github_pages

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: marketing/.output/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github_pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
